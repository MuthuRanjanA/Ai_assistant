# Server Configuration (Supports local 8080 and cloud dynamic $PORT)
server.port=${PORT:8080}

# Groq API Configuration
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1/chat/completions}

# OpenRouter Configuration (Optional fallback)
openrouter.api.key=${OPENROUTER_API_KEY:}
openrouter.model=${OPENROUTER_MODEL:google/gemini-2.5-flash}
openrouter.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}

# Gemini API Configuration (Optional fallback)
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-1.5-flash}

# Logging Configuration
logging.level.com.example.aiassistant=INFO
logging.level.org.springframework.web=INFO
